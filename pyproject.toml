# SPDX-License-Identifier: GPL-3.0-or-later
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-toolbox"
dynamic = ["version"]
description = "Quiet, local tools for people who send or merge pull requests on any GitHub project: landing order, PR health, a pre-push check, and a map of all open PRs, with a built-in OpenEMR profile."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "anun333" }]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/anun333/pr-toolbox"
Issues = "https://github.com/anun333/pr-toolbox/issues"

[project.scripts]
pr-toolbox = "pr_toolbox.__main__:main"
pr-tools = "pr_toolbox.__main__:main"
openemr-pr-tools = "pr_toolbox.__main__:main"

[tool.setuptools]
packages = ["pr_toolbox", "pr_toolbox.motion", "openemr_pr_tools"]

[tool.setuptools.package-data]
pr_toolbox = ["presets/*.json", "motion/*.php", "motion/*.html", "motion/*.md"]

[tool.setuptools.dynamic]
version = { attr = "pr_toolbox.__version__" }
